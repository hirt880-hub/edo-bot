<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDO Personal Training | Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 420px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .chat-header {
      background: #e8ae00;
      color: #1a1a1a;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header span {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.8;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f5f5f5;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot {
      background: #fff;
      border: 1px solid #ddd;
      align-self: flex-start;
    }

    .message.user {
      background: #e8ae00;
      color: #1a1a1a;
      align-self: flex-end;
      font-weight: 500;
    }

    .chat-input {
      display: flex;
      padding: 14px;
      border-top: 1px solid #ddd;
      background: #fff;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .chat-input input:focus {
      border-color: #e8ae00;
    }

    .chat-input button {
      background: #e8ae00;
      color: #1a1a1a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #d09c00;
    }

    .typing {
      font-size: 13px;
      color: #999;
      font-style: italic;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      🥊 EDO Personal Training
      <span>— Dein Trainings-Assistent</span>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Hallo! Ich bin der Assistent von EDO Personal Training. Wie kann ich dir helfen? 💪
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Deine Frage..." />
      <button onclick="sendMessage()">Senden</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const messages = document.getElementById('messages');

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.textContent = 'EDO-Assistent schreibt...';
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        messages.removeChild(typing);
        addMessage(data.reply || 'Keine Antwort erhalten.', 'bot');
      } catch (err) {
        messages.removeChild(typing);
        addMessage('Fehler beim Verbinden. Bitte versuche es später.', 'bot');
      }
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
